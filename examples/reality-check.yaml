publications:
  - id: local-reality-check
    title: Local Reality Check
    language: en
    budget:
      max_articles: 8
      min_articles: 1
    editorial:
      enabled: true
      influence: none
      remote_processing: false
      provider: ollama
      model_pair:
        editorial_model: gemma4:12b-mlx
        verifier_model: gemma4:e4b-mlx
        editorial_prompt_version: article-summary-v1
        verifier_prompt_version: evidence-check-v1
        schema_version: 1
      capabilities: [article_summary]
      cost_envelope:
        max_calls: 24
        max_tokens: 12000
      ollama_host: http://127.0.0.1:11434
    sections:
      - id: current
        title: Current reporting
        sources: [david, ars, svt, ekot]
  # The scheduled Edition. It shares the Sources above rather than restating them, so a
  # rights review recorded once governs both Publications and cannot drift between them.
  # The household Edition. One book, six sections, read by four people: everyone shares
  # Aktuellt, and each reader has their own section that anyone else may also read.
  #
  # Editorial runs remotely because a GitHub-hosted runner has no Ollama. Dated model pins,
  # not floating aliases: a Model Pair that silently changed under a schedule would change
  # the Edition with nobody reading the diff. Note that remote eligibility still reaches one
  # Source only, so almost nothing here is ever summarised.
  - id: daily
    title: Morgonutgåvan
    language: sv
    # The daily reads the weekly for the same reason the weekly reads the daily: one reader
    # reads both, and Monday reprinting what Saturday carried was observed live, three
    # mornings in a row. The two never run on the same day, so whichever delivered first
    # settles precedence deterministically.
    reads_history_from: [weekly]
    max_briefs: 6
    budget:
      max_articles: 15
      min_articles: 1
    policies:
      # Source plurality is a current-affairs value: an Edition should not see the day
      # through one publisher's eyes. One day of age, not more: SVT publishes a nightly
      # "Nattens nyheter" roundup, and without the window yesterday's roundup was delivered
      # alongside today's.
      aktuellt:
        type: coverage
        minimum_sources: 2
        max_age_days: 1
      # A personal section owes nobody a second opinion, so plurality never warns here —
      # but it does spread: 0.4 caps a three-slot section at one Article per source when
      # other sources have candidates, and relaxes back to the flood when they do not.
      # Two weeks of age, because a starved section once reached into July and delivered
      # a notice for an exhibition that had already closed; partial beats stale.
      personlig:
        type: interest
        minimum_sources: 1
        single_source_cap: 0.4
        max_age_days: 14
        # Item types that are not reading. A horoscope arrives as three unlabelled
        # paragraphs once the publisher's image separators are stripped, and the show
        # transcripts are timestamped dialogue running to thousands of words. Both are
        # a Source publishing something other than articles, which is a selection
        # question rather than a rights one.
        mute_rules:
          - rule:
              field: title
              match: phrase
              value: horoskop
          - rule:
              field: title
              match: phrase
              value: OpenSourceMalware Show
    editorial:
      enabled: true
      remote_processing: true
      provider: openai
      model_pair:
        editorial_model: gpt-5.4-2026-03-05
        verifier_model: gpt-5.4-mini-2026-03-17
        editorial_prompt_version: article-summary-v1
        verifier_prompt_version: evidence-check-v1
        schema_version: 1
      capabilities: [article_summary]
      cost_envelope:
        max_calls: 12
        max_tokens: 12000
    sections:
      # SVT's per-section feeds, not svt.se/rss.xml. The site-wide feed is an
      # all-sections firehose in which sport crowds out the national and international
      # reporting this Section exists to carry.
      - id: aktuellt
        title: Aktuellt
        policy: aktuellt
        budget:
          max_articles: 4
        sources: [svt_inrikes, svt_utrikes, ekot]
      - id: anna
        title: Anna
        policy: personlig
        budget:
          max_articles: 3
        sources: [runnersworld, svt_kultur, attention, forskning_skola, specialnest, elle]
      - id: david
        title: David
        policy: personlig
        budget:
          max_articles: 3
        sources:
          - david
          - ars
          - svt_vetenskap
          - nasa
          - kubernetes
          - krebs
          - hackaday
          - prusa
          - bleepingcomputer
          - cybersecuritynews
          - opensourcemalware
          - githubblog
      - id: alice
        title: Alice
        policy: personlig
        budget:
          max_articles: 3
        sources: [danstidningen, snexplores]
      - id: linnea
        title: Linnea
        policy: personlig
        budget:
          max_articles: 2
        sources: [svt_damallsvenskan, svt_fotboll, wwf, natgeokids]

  # Saturday. The same Sources and the same five Sections as the daily, at twice the Budget,
  # carrying what the weekday Editions had no room for.
  #
  # `reads_history_from: [daily]` is what makes that a description rather than a hope. Every
  # Article and every Brief the daily delivered is suppressed here, so the Saturday Edition cannot
  # reprint the week it is supposed to complete, and the Story Clusters the daily kept returning
  # to rank above Source weight inside each Section's own ordering - the week's continuing threads
  # first, then everything that never got a slot.
  #
  # Recurrence ranks below a declared interest and never reorders the Essential Coverage Slice.
  # Neither policy below declares positive rules or essential coverage today, so in practice
  # recurrence is the leading discriminator in all five Sections - worth knowing when reading the
  # first few Saturdays, because adding interest rules later will quietly demote it.
  #
  # The reference is mutual: the weekly knows the daily, and the daily knows the weekly. It
  # began one-directional, and the first delivered week showed why that was wrong — Monday
  # through Wednesday reprinted articles Saturday had already carried, because the daily had
  # no idea they were delivered. One reader reads both, so each suppresses against the other.
  #
  # `recovers_near_misses: true` is what lets Saturday reach back past the feeds' own memory.
  # A Saturday Run acquires from the same live feeds as any other, so alone it could only carry
  # what is still in them — and Monday's near-miss has usually fallen off by Saturday. Every
  # Publication records its Near Misses (body-free pointers: an Article identity and its
  # Source; the canonical URL is already in the State Store), and this one, because it reads
  # the daily's history, may re-fetch them: the week's Near Misses, newest first, at most 20
  # page fetches per Run, skipping anything already delivered or already in the feeds. The
  # re-fetch runs through the same evidence, origin-allowlist, robots and SSRF checks as any
  # acquisition, and only against `web`/`auto` Sources — a feed-only or metadata-only Source's
  # evidence never contemplated page fetches, so its misses stay missed.
  - id: weekly
    title: Veckoutgåvan
    language: sv
    reads_history_from: [daily]
    recovers_near_misses: true
    # Twice the daily's Briefs, for six days of them rather than one.
    max_briefs: 12
    budget:
      max_articles: 30
      min_articles: 1
    # Policies are per-Publication, so these are deliberately the daily's, duplicated rather
    # than shared. A weekly that quietly inherited an edit to the daily's mute rules would be
    # the same coupling `reads_history_from` was kept narrow to avoid. The age windows differ
    # where the Editions differ: a Saturday Edition carries the week, so its news window is
    # the week, not the night.
    policies:
      aktuellt:
        type: coverage
        minimum_sources: 2
        max_age_days: 7
      personlig:
        type: interest
        minimum_sources: 1
        single_source_cap: 0.4
        max_age_days: 14
        mute_rules:
          - rule:
              field: title
              match: phrase
              value: horoskop
          - rule:
              field: title
              match: phrase
              value: OpenSourceMalware Show
    editorial:
      enabled: true
      remote_processing: true
      provider: openai
      model_pair:
        editorial_model: gpt-5.4-2026-03-05
        verifier_model: gpt-5.4-mini-2026-03-17
        editorial_prompt_version: article-summary-v1
        verifier_prompt_version: evidence-check-v1
        schema_version: 1
      capabilities: [article_summary]
      # Scaled with the Budget, not with hope: remote eligibility still reaches exactly one
      # Source, so almost nothing here is ever summarised and the envelope is a ceiling rather
      # than a forecast.
      cost_envelope:
        max_calls: 24
        max_tokens: 24000
    sections:
      - id: aktuellt
        title: Aktuellt
        policy: aktuellt
        budget:
          max_articles: 8
        sources: [svt_inrikes, svt_utrikes, ekot]
      - id: anna
        title: Anna
        policy: personlig
        budget:
          max_articles: 6
        sources: [runnersworld, svt_kultur, attention, forskning_skola, specialnest, elle]
      - id: david
        title: David
        policy: personlig
        budget:
          max_articles: 6
        sources:
          - david
          - ars
          - svt_vetenskap
          - nasa
          - kubernetes
          - krebs
          - hackaday
          - prusa
          - bleepingcomputer
          - cybersecuritynews
          - opensourcemalware
          - githubblog
      - id: alice
        title: Alice
        policy: personlig
        budget:
          max_articles: 6
        sources: [danstidningen, snexplores]
      - id: linnea
        title: Linnea
        policy: personlig
        budget:
          max_articles: 4
        sources: [svt_damallsvenskan, svt_fotboll, wwf, natgeokids]
