version: 1
# The only remote editorial provider, and the terms it is recorded as operating under.
# `training_opt_in` and `store` are gates: a profile asserting either refuses to load at all,
# before a Source is fetched. `application_state_retention_days: 0` matches the adapter's
# `prompt_cache_retention: in_memory`, which turns off the default 24-hour prompt cache;
# `max_abuse_retention_days` is OpenAI's published standard abuse-monitoring window, and is
# the reason SVT stays ineligible — closing it needs a sales-approved Zero Data Retention
# agreement, not a configuration change. See docs/remote-llm-eligibility.md.
remote_providers:
  openai:
    training_opt_in: false
    store: false
    application_state_retention_days: 0
    max_abuse_retention_days: 30
    region: global
    tools: none
sources:
  david:
    title: David Lowe Larsson
    default_article_language: en
    publisher_id: davidlowelarsson.com
    copyright_notice: Copyright David Lowe Larsson
    allowed_publisher_origins: [https://davidlowelarsson.com]
    feed_url: https://davidlowelarsson.com/rss.xml
    acquisition: feed
    # The rightsholder is the operator, and granted remote processing in #67. `remote_llm:
    # allow` recorded the grant; this line is the operator policy limb finally agreeing with
    # it. Both gates must say yes, which is why they are separate fields.
    llm_processing: remote_allowed
    rights:
      basis: operator_owned_site_attested_private_use
      audience: single_operator
      attribution_required: true
      media_reuse: false
    eligibility:
